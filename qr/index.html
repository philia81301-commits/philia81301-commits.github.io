<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 總表｜潘湘如醫師臨床工具集</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#fbfaf7; color:#2e2a22;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto;padding:2rem 1.2rem 3rem;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
    border-bottom:2px solid #9a6b2a;padding-bottom:.8rem;margin-bottom:1.6rem;flex-wrap:wrap;}
  h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.5rem;letter-spacing:.05em;}
  .sub{color:#7d7466;font-size:.85rem;}
  .print-btn{
    font:inherit;font-size:.85rem;font-weight:500;color:#fff;background:#9a6b2a;
    border:none;border-radius:6px;padding:.5rem 1.2rem;cursor:pointer;
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}
  .item{
    background:#fff;border:1px solid #eae4d9;border-radius:8px;
    padding:1rem .8rem;text-align:center;
    break-inside:avoid;page-break-inside:avoid;
  }
  .item img{width:100%;max-width:150px;height:auto;display:block;margin:0 auto .5rem;}
  .item .name{font-weight:700;font-size:.9rem;line-height:1.4;}
  .item .zone{color:#9a6b2a;font-size:.72rem;letter-spacing:.15em;margin-top:.2rem;}
  footer{margin-top:1.6rem;color:#7d7466;font-size:.78rem;text-align:center;}
  @media print{
    body{background:#fff;}
    .print-btn, .no-print{display:none;}
    .wrap{max-width:none;padding:0;}
    .item{border-color:#ccc;}
    @page{size:A4;margin:12mm;}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>潘湘如醫師｜臨床工具集 QR 總表</h1>
    <div class="sub">掃描開啟對應工具・philia81301-commits.github.io</div>
  </div>
  <button class="print-btn" onclick="window.print()">列印本頁</button>
</header>

<div class="grid">
  <div class="item"><img src="../assets/qr/home.svg" alt="工具集首頁 QR"><div class="name">工具集首頁</div><div class="zone">入口</div></div>
  <div class="item"><img src="../assets/qr/weight-reports.svg" alt="減重門診月度分析報告 QR"><div class="name">減重門診月度分析報告</div><div class="zone">門診臨床</div></div>
  <div class="item"><img src="../assets/qr/glp1-edu.svg" alt="GLP-1 減重衛教 QR"><div class="name">GLP-1 減重衛教</div><div class="zone">門診衛教</div></div>
  <div class="item"><img src="../assets/qr/weight-game.svg" alt="減重大冒險 QR"><div class="name">減重大冒險</div><div class="zone">候診衛教</div></div>
  <div class="item"><img src="../assets/qr/osteo.svg" alt="骨質疏鬆門診工具 QR"><div class="name">骨質疏鬆門診工具</div><div class="zone">門診臨床</div></div>
  <div class="item"><img src="../assets/qr/hp.svg" alt="幽門螺旋桿菌陽性處置 QR"><div class="name">幽門螺旋桿菌陽性處置</div><div class="zone">門診臨床</div></div>
  <div class="item"><img src="../assets/qr/pneumo.svg" alt="肺炎鏈球菌疫苗 QR"><div class="name">肺炎鏈球菌疫苗</div><div class="zone">門診臨床</div></div>
  <div class="item"><img src="../assets/qr/pi.svg" alt="入院病歷 PI 產生器 QR"><div class="name">入院病歷 PI 產生器</div><div class="zone">門診臨床</div></div>
  <div class="item"><img src="../assets/qr/sarco.svg" alt="肌少症篩檢紀錄工具 QR"><div class="name">肌少症篩檢紀錄工具</div><div class="zone">社區篩檢</div></div>
  <div class="item"><img src="../assets/qr/sarco-quiz.svg" alt="肌少症衛教小測驗 QR"><div class="name">肌少症衛教小測驗</div><div class="zone">社區衛教</div></div>
  <div class="item"><img src="../assets/qr/ai-teaching.svg" alt="AI Agent 醫療職場入門 QR"><div class="name">AI Agent 醫療職場入門</div><div class="zone">教學演講</div></div>
  <div class="item"><img src="../assets/qr/obesity-talk.svg" alt="肥胖學會演講 QR"><div class="name">人工智慧在肥胖治療運用的新發展</div><div class="zone">教學演講</div></div>
</div>

<footer class="no-print"><a href="../" style="color:#9a6b2a">← 回工具集首頁</a>・列印後可張貼於診間或演講會場</footer>

</div>
</body>
</html>
